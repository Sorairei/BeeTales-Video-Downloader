services:
  api:
    build: .
    ports:
      - "8787:8787"
    environment:
      PUBLIC_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      MAX_CONCURRENT_JOBS: 2
      MAX_FILE_SIZE_MB: 1024
    read_only: true
    tmpfs:
      - /tmp:size=2G,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped
