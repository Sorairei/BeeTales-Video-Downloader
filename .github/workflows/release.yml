name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download verified runtime projects
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-VerifiedReleaseAsset {
            param(
              [Parameter(Mandatory = $true)][string]$Repository,
              [Parameter(Mandatory = $true)][string]$AssetName,
              [Parameter(Mandatory = $true)][string]$Destination
            )

            $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$Repository/releases/latest" -Headers $headers
            $asset = $release.assets | Where-Object name -eq $AssetName | Select-Object -First 1
            if (-not $asset) { throw "Release asset not found: $Repository/$AssetName" }
            if (-not $asset.digest -or -not $asset.digest.StartsWith("sha256:")) {
              throw "GitHub did not provide a SHA-256 digest for $Repository/$AssetName"
            }

            Invoke-WebRequest -Uri $asset.browser_download_url -Headers $headers -OutFile $Destination
            $expected = $asset.digest.Substring(7).ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Destination).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA-256 verification failed for $Repository/$AssetName" }
            Write-Host "Verified $AssetName ($actual)"
          }

          New-Item -ItemType Directory -Path vendor -Force | Out-Null
          Get-VerifiedReleaseAsset -Repository "yt-dlp/FFmpeg-Builds" -AssetName "ffmpeg-master-latest-win64-gpl.zip" -Destination "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg archive is incomplete" }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination vendor\ffmpeg.exe
          Copy-Item -LiteralPath $ffprobe.FullName -Destination vendor\ffprobe.exe
          Get-VerifiedReleaseAsset -Repository "denoland/deno" -AssetName "deno-x86_64-pc-windows-msvc.zip" -Destination "$env:RUNNER_TEMP\deno.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\deno.zip" -DestinationPath "$env:RUNNER_TEMP\deno"
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\deno\deno.exe" -Destination vendor\deno.exe
      - name: Build and validate executable
        shell: pwsh
        run: |
          $env:BUILD_PYTHON = (Get-Command python).Source
          ./build_release.ps1
      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath "dist\BeeTales Video Downloader.exe" -Destination release
          Copy-Item -LiteralPath LICENSE,THIRD_PARTY_NOTICES.md -Destination release
          Compress-Archive -Path release\* -DestinationPath "BeeTales-Video-Downloader-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BeeTales-Video-Downloader-Windows-x64
          path: BeeTales-Video-Downloader-Windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: BeeTales-Video-Downloader-Windows-x64.zip
          generate_release_notes: true
