name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_downloader.py
      - run: python -m py_compile app.py downloader.py queue_manager.py release_metadata.py settings.py release_smoke.py theme.py
      - name: Validate desktop runtime
        run: python -c "import tkinter as tk; import app; root=tk.Tk(); root.withdraw(); root.update(); root.destroy()"
